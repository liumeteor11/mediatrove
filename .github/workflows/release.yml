name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and Release Desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the in-app update artifacts (latest.json + *.sig). The key
          # is password-protected, so BOTH env vars must be set — an unset
          # password makes the CLI prompt interactively (hangs CI), and an
          # empty string is treated as a wrong password.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'MediaTrove ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          # The updater installs the NSIS setup on Windows (MSI has no silent
          # webview bootstrapping); latest.json should point at that artifact.
          updaterJsonPreferNsis: true

  release-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        # v4.0.2 fixed the action failing on the removed legacy "tools" SDK
        # package ("Failed to find package 'tools'"); keep >= v4.
        uses: android-actions/setup-android@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install NDK
        run: |
          sdkmanager "ndk;25.0.8775105"
          # r0adkll/sign-android-release@v1 hardcodes build-tools 29.0.3 for
          # zipalign/apksigner; new runner images no longer preinstall it.
          sdkmanager "build-tools;29.0.3"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.0.8775105" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm install

      - name: Init Tauri Android
        run: npm run tauri android init

      - name: Set Android app label
        # gen/android is not committed — `tauri android init` regenerates it
        # with the lowercase productName as the launcher label. Patch it to the
        # display name on every build; the pattern preserves extra attributes
        # like translatable="false".
        run: |
          found=0
          for f in $(find src-tauri/gen/android/app/src/main/res -name strings.xml); do
            if grep -q 'name="app_name"' "$f"; then
              sed -i 's|<string name="app_name"\([^>]*\)>[^<]*</string>|<string name="app_name"\1>MediaTrove</string>|' "$f"
              found=1
            fi
          done
          if [ "$found" != "1" ]; then
            echo "::warning::No app_name string found in the generated Android resources — launcher label was not patched."
          fi

      - name: Build Android APK
        run: npm run tauri android build -- --apk true
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "$KS_B64" ] && [ -n "$KEY_ALIAS" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS / ANDROID_STORE_PASSWORD / ANDROID_KEY_PASSWORD) are not configured — uploading the unsigned APK instead."
          fi
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # Must match the names the "Sign Android Release" step below reads —
          # it uses ANDROID_STORE_PASSWORD, not ANDROID_KEY_STORE_PASSWORD.
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sign Android Release
        id: sign_app
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          # Tauri emits the universal flavor APK under apk/universal/release
          # (app-universal-release-unsigned.apk).
          releaseDirectory: src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Prepare Android APK
        if: startsWith(github.ref, 'refs/tags/v')
        id: apk
        run: |
          SRC="${{ steps.sign_app.outputs.signedReleaseFile }}"
          if [ -z "$SRC" ]; then
            # Signing secrets not configured — fall back to the unsigned build.
            SRC="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          fi
          # Release under a clean, versioned name instead of gradle's
          # "app-universal-release-unsigned-signed.apk".
          DEST="MediaTrove-${{ github.ref_name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload Android Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: ${{ steps.apk.outputs.path }}
          draft: true
          tag_name: ${{ github.ref_name }}
