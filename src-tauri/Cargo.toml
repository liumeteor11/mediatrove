[package]
name = "mediatrove"
version = "0.1.26"
description = "Your AI-powered media trove: search, track and chat with characters"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "mediatrove_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.1", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["devtools"] }
tauri-plugin-shell = "2.0.1"
tauri-plugin-dialog = "~2.4"
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip", "brotli"], default-features = false }
tokio = { version = "1", features = ["full"] }
urlencoding = "2.1"
quick-xml = "0.31"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
axum = "0.8.4"
mdns-sd = "0.17.1"
local-ip-address = "0.6.8"
hostname = "0.4.2"
scraper = "0.25.0"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
